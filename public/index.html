<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Untuned Ordinal Zero Index</title>
    <!-- Tailwind CSS for clean, high-performance styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0f19; color: #f3f4f6; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
        .node-card:hover { border-color: #38bdf8; transform: translateY(-2px); transition: all 0.2s ease-in-out; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="border-b border-slate-800 p-6 flex justify-between items-center bg-slate-900/50 backdrop-blur">
        <div>
            <h1 id="site-title" class="text-xl font-bold tracking-wider text-cyan-400">The Untuned Ordinal Zero Index</h1>
            <p id="site-meta" class="text-xs text-slate-400 mt-1">Loading metadata...</p>
        </div>
        <div class="text-xs px-3 py-1 bg-cyan-950 border border-cyan-800 text-cyan-300 rounded-full">
            Benchmark: E = 0
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 flex flex-col md:flex-row p-6 gap-6 max-w-7xl mx-auto w-full">
        
        <!-- Left: Fractal Singularity Tree Canvas -->
        <div class="flex-1 flex flex-col gap-4">
            <div class="bg-slate-900/80 border border-slate-800 rounded-xl p-5 shadow-xl">
                <h2 class="text-sm font-semibold uppercase tracking-widest text-slate-400 mb-2">Singularity Root</h2>
                <div id="root-singularity" class="p-4 bg-slate-950 border border-cyan-900 rounded-lg cursor-pointer hover:border-cyan-500 transition">
                    <div class="text-lg font-bold text-cyan-300" id="sing-name">Loading Root...</div>
                    <div class="text-xs text-slate-400 mt-1" id="sing-coords">Coordinates: --</div>
                    <div class="text-xs text-emerald-400 mt-1" id="sing-closure">Closure: --</div>
                </div>
            </div>

            <!-- Branch Plates -->
            <div class="bg-slate-900/80 border border-slate-800 rounded-xl p-5 shadow-xl flex-1">
                <h2 class="text-sm font-semibold uppercase tracking-widest text-slate-400 mb-4">Core Index Plates</h2>
                <div id="plates-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <!-- Dynamic Plates Injected Here -->
                </div>
            </div>
        </div>

        <!-- Right: Inspector Side Panel -->
        <div class="w-full md:w-96 bg-slate-900/90 border border-slate-800 rounded-xl p-6 shadow-2xl flex flex-col">
            <h2 class="text-sm font-semibold uppercase tracking-widest text-slate-400 mb-4 border-b border-slate-800 pb-2">Expressable Inspector</h2>
            <div id="inspector-content" class="flex-1 text-sm text-slate-300 space-y-4">
                <p class="text-slate-500 italic">Select any node or plate on the left to inspect its exact ledger values, dimensions, and coordinate definitions.</p>
            </div>
        </div>

    </main>

    <!-- Script to load and render master_index.json -->
    <script>
        async function loadIndex() {
            try {
                const response = await fetch('master_index.json');
                if (!response.ok) throw new Error('Failed to load master_index.json');
                const data = await response.json();

                // Populate Header
                document.getElementById('site-title').innerText = data.meta.title;
                document.getElementById('site-meta').innerText = `Version ${data.meta.version} — ${data.meta.philosophy}`;

                // Populate Singularity Root
                const sing = data.singularity;
                document.getElementById('sing-name').innerText = sing.name;
                document.getElementById('sing-coords').innerText = `Spacetime Metrics: ${sing.coordinates}`;
                document.getElementById('sing-closure').innerText = `Closure Status: ${sing.closure_status}`;

                // Click handler for root
                document.getElementById('root-singularity').onclick = () => {
                    showInspector({
                        name: sing.name,
                        type: "Singularity Root",
                        coordinates: sing.coordinates,
                        closure: sing.closure_status,
                        description: sing.description
                    });
                };

                // Populate Children Plates
                const grid = document.getElementById('plates-grid');
                grid.innerHTML = '';
                
                sing.children.forEach(plate => {
                    const card = document.createElement('div');
                    card.className = "node-card bg-slate-950 border border-slate-800 rounded-lg p-4 cursor-pointer";
                    card.innerHTML = `
                        <div class="font-bold text-slate-200">${plate.name}</div>
                        <div class="text-xs text-slate-500 mt-1">Instrument: ${plate.instrument || 'core'}</div>
                        <div class="text-xs text-cyan-400 mt-2">${plate.total_cells ? plate.total_cells + ' cells' : 'Active Plate'}</div>
                    `;
                    card.onclick = () => showInspector(plate);
                    grid.appendChild(card);
                });

            } catch (err) {
                console.error(err);
                document.getElementById('inspector-content').innerHTML = `
                    <div class="text-rose-400 font-semibold">Error Loading Data</div>
                    <p class="text-xs text-slate-400 mt-2">Could not find or parse <code>master_index.json</code>. Ensure you have run your export script into the <code>public/</code> folder.</p>
                `;
            }
        }

        function showInspector(node) {
            const container = document.getElementById('inspector-content');
            container.innerHTML = `
                <div>
                    <span class="text-xs text-cyan-400 uppercase tracking-widest">${node.id || 'Node Details'}</span>
                    <h3 class="text-lg font-bold text-white mt-1">${node.name}</h3>
                </div>
                <div class="bg-slate-950 p-3 rounded border border-slate-800 text-xs space-y-2">
                    <div><span class="text-slate-500">Instrument:</span> <code class="text-cyan-300">${node.instrument || 'N/A'}</code></div>
                    <div><span class="text-slate-500">Total Cells:</span> ${node.total_cells || 'Continuous'}</div>
                    <div><span class="text-slate-500">Description:</span> ${node.description || 'Verified metric plate.'}</div>
                </div>
                ${node.coordinates_def ? `
                    <div class="text-xs">
                        <div class="text-slate-400 font-semibold mb-1">Coordinate Axes:</div>
                        <pre class="bg-slate-950 p-2 rounded border border-slate-800 text-cyan-200 overflow-x-auto">${JSON.stringify(node.coordinates_def, null, 2)}</pre>
                    </div>
                ` : ''}
                ${node.target_coordinates ? `
                    <div class="text-xs">
                        <div class="text-slate-400 font-semibold mb-1">Target Isomer / Matrix:</div>
                        <pre class="bg-slate-950 p-2 rounded border border-slate-800 text-emerald-300 overflow-x-auto">${JSON.stringify(node.target_coordinates, null, 2)}</pre>
                    </div>
                ` : ''}
            `;
        }

        loadIndex();
    </script>
</body>
</html>
