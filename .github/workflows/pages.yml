# Deploy public/ — the interactive index (docs/WEB-INDEX.md) — to GitHub Pages.
#
# The Pages site must exist before this runs. configure-pages carries enablement: true so
# that, where the job's token may create the site, it does; on this repository it may not —
# run 35385180002 (2026-09-18) failed at that step with "Resource not accessible by
# integration", because the repository is private and GITHUB_TOKEN cannot create a Pages
# site there. Create it once under Settings → Pages with source "GitHub Actions" (a private
# repository needs a plan that includes Pages), or make the repository public; then this
# workflow's next run deploys, and enablement: true is a no-op.
#
# public/data/ is committed, generated by `python3 tools/webindex.py`; nothing
# is computed here. The checkout is shallow and sparse because the repository
# is ~500 MB and the site needs only public/.

name: Pages

on:
  push:
    branches: [main]
    paths: ["public/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: public
          sparse-checkout-cone-mode: true
      - uses: actions/configure-pages@v5
        with:
          # Creates the site if the token may; on this private repository it may not (see
          # the header), so the site is created once in Settings and this is a no-op.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
