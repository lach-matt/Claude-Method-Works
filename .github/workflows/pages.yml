# Deploy public/ — the interactive index (docs/WEB-INDEX.md) — to GitHub Pages.
#
# No Settings step is needed: configure-pages runs with enablement: true, which creates the
# Pages site with source "GitHub Actions" on first run (the job holds pages: write).
#
# public/data/ is committed, generated by `python3 tools/webindex.py`; nothing
# is computed here. The checkout is shallow and sparse because the repository
# is ~500 MB and the site needs only public/.

name: Pages

on:
  push:
    branches: [main]
    paths: ["public/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: public
          sparse-checkout-cone-mode: true
      - uses: actions/configure-pages@v5
        with:
          # Creates the Pages site with source "GitHub Actions" if it does not exist yet, so
          # no Settings → Pages step is needed; idempotent once it exists.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
