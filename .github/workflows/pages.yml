# Deploy public/ — the interactive index (docs/WEB-INDEX.md) — to GitHub Pages.
#
# One-time setup by a repo admin: Settings → Pages → Source: "GitHub Actions".
# Until that is set, this workflow runs and the deploy step fails harmlessly.
#
# public/data/ is committed, generated by `python3 tools/webindex.py`; nothing
# is computed here. The checkout is shallow and sparse because the repository
# is ~500 MB and the site needs only public/.

name: Pages

on:
  push:
    branches: [main]
    paths: ["public/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: public
          sparse-checkout-cone-mode: true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
